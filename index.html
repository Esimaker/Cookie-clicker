<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A playful cookie clicker starter game.">
	<title>Pepe Clicker</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<!-- Header -->
	<header class="site-header">
		<div class="brand">
			<button class="brand-mark" type="button" data-action="brand-sound" aria-label="Play Pepe sound">
				<img src="Pepe The Frog Dancing GIF – Pepe The Frog Dancing Mood – discover and share GIFs.gif" alt="Pepe">
			</button>
			Pepe Clicker
		</div>
	</header>

	<main class="game-layout">
		<!-- Left: Pepe button -->
		<section class="left-column" aria-labelledby="game-title">
			<div class="click-zone">
				<h1 id="game-title" class="click-prompt">Click me</h1>
				<button class="cookie-button" type="button" data-action="click-cookie" aria-label="Click the cookie to earn cookies">
					<img class="cookie-image" src="images (1) (1).webp" alt="">
				</button>
			</div>
		</section>

		<!-- Center: reserved for future features -->
		<section class="center-panel" aria-label="Reserved space for future content"></section>

		<!-- Right: Score and upgrades -->
		<aside class="score-panel" aria-label="Game status">
			<div class="panel-actions right-actions" aria-label="Game controls">
				<button class="header-button" type="button" data-action="save">Save game</button>
				<button class="header-button" type="button" data-action="theme" aria-label="Switch to dark mode">Dark mode</button>
				<button class="header-button" type="button" data-action="reset">New game</button>
			</div>
			<div class="score-body">
				<div>
					<p class="score-heading">Cookies baked</p>
					<p class="score" data-display="score">0</p>
					<div class="stats">
						<div class="stat"><span class="stat-label">Per click</span><span class="stat-value" data-display="per-click">1</span></div>
						<div class="stat"><span class="stat-label">Per second</span><span class="stat-value" data-display="per-second">0</span></div>
					</div>
				</div>

				<div>
					<h2 class="upgrade-title">Upgrades <span data-display="upgrade-count">0</span></h2>
					<div class="upgrade-list" data-display="upgrades"></div>
				</div>
			</div>
		</aside>
	</main>
	<script src="Script.js"></script>
</body>
</html>
